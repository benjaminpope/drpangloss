# Author : Benjamin Pope
# Date : 23/2/2024
# Title : tests.yml
# Description : Automatically runs tests when branches are merged.
#   The tests that are run can be found in the tests directory.

name: automated tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      # Linting lives in lint.yml and docs builds in documentation.yml, so
      # neither blocks the test suite.

      # ===== Tests =====
      - name: Test Suite
        run: uv run --python .venv/bin/python pytest

  # The optional NUFFT backend, tested separately so that the main job
  # checks that drpangloss works without it.
  nufft:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev,nufft]"

      # Fail loudly if the extra does not import, rather than letting
      # tests/test_nufft.py skip itself.
      - name: NUFFT tests
        run: |
          .venv/bin/python -c "import jax_finufft"
          uv run --python .venv/bin/python pytest tests/test_nufft.py
