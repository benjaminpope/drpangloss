# Author : Benjamin Pope
# Date : 23/2/2024
# Title : tests.yml
# Description : Runs the test suite in tiers (the table is in
#   .github/scripts/ci_matrix.py); checks needing no JAX compiles are in lint.yml.

name: automated tests
on:
  push: {branches: [main]}
  pull_request:
    # `labeled` is for the full-ci label; any other label runs nothing.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 3 * * *"
  # Also dispatched by lock-upgrade.yml; `nightly` runs the nightly tier by hand.
  workflow_dispatch: {inputs: {nightly: {description: Run the nightly tier, type: boolean, default: false}}}

concurrency:
  # A label other than full-ci gets its own group: it must not cancel the PR's run.
  group: tests-${{ github.event_name }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {contents: read}

jobs:
  matrix:
    name: choose the test matrix
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    outputs: {matrix: "${{ steps.choose.outputs.matrix }}"}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github/scripts}
      - id: choose
        env:
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_matrix.py >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} py${{ matrix.python-version }}${{ matrix.x64 == '1' && ' x64' || '' }}${{ matrix.lowest && ' lowest' || '' }}${{ matrix.canary && ' canary' || '' }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    # Fail a hung job instead of holding a runner for GitHub's 6 hours. The
    # 30 minutes are for the pull-request gate's shards (about 10); the
    # unsharded full-tier jobs (macOS, py3.13, the floors) run the whole
    # suite on one runner, which py3.13 takes over 30 minutes for.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly) && 90 || github.event_name == 'pull_request' && matrix.shard && !matrix.slow && !matrix.orbit_slow && 30 || 45 }}
    strategy: {fail-fast: false, matrix: "${{ fromJSON(needs.matrix.outputs.matrix) }}"}
    env: {JAX_ENABLE_X64: "${{ matrix.x64 }}", UV_PYTHON: "${{ matrix.python-version }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # The floors include the orbits extra, so jaxoplanet's is tested too.
      # Versions come from uv.lock (lock-upgrade.yml keeps it current; the
      # nightly canary runs ahead of it). harmonix is a dependency group.
      - name: create environment
        run: |
          if [ "${{ matrix.lowest }}" = "true" ]; then
            uv venv .venv
            uv pip install --python .venv/bin/python --resolution lowest-direct -e ".[test,orbits]"
          elif [ "${{ matrix.canary }}" = "true" ]; then
            uv lock --upgrade
            uv sync --extra test --extra integrations --group harmonix
          else
            uv sync --locked --extra test --extra integrations --group harmonix
          fi
          uv pip list --python .venv/bin/python

      # The JAX compilation cache is keyed on the job, JAX version, shard
      # packing and ISO week. The first push or nightly of a week saves it
      # from an empty cache; pull requests restore the latest match. A new
      # packing means a new cache, and the per-test budget stays off until
      # then (the nightly deletes older weeks' caches).
      - name: JAX version, week and packing
        id: key
        shell: bash
        run: |
          jax=$(.venv/bin/python -c 'import jax; print(jax.__version__)')
          pack=$( (cat tests/test_durations.json; git ls-files 'tests/*test_*.py') | shasum -a 256 | cut -c1-8)
          echo "jax=$jax" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "prefix=jax-${{ matrix.id }}-jax$jax-pack$pack-" >> "$GITHUB_OUTPUT"

      # A run that will save a new key starts from nothing.
      - name: look up this week's cache
        id: lookup
        uses: actions/cache/restore@v4
        with: {path: .jax-cache, key: "${{ steps.key.outputs.prefix }}${{ steps.key.outputs.week }}", lookup-only: true}

      - name: restore JAX compilation cache
        id: cache
        if: (github.event_name != 'push' && github.event_name != 'schedule') || steps.lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .jax-cache
          key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.week }}
          # Then any cache of this job and JAX, then of the same OS, Python, x64.
          restore-keys: |
            ${{ steps.key.outputs.prefix }}
            jax-${{ matrix.id }}-jax${{ steps.key.outputs.jax }}-
            jax-${{ matrix.os }}-py${{ matrix.python-version }}-x64${{ matrix.x64 }}

      # loadgroup keeps each xdist_group module on one worker. The JUnit
      # report carries the validates markers (tests/conftest.py) as evidence
      # for virgil-validation; xunit1 keeps test properties.
      - name: Test Suite
        env:
          JAX_COMPILATION_CACHE_DIR: .jax-cache
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
          JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
          # The float64 jobs skip the dtype-independent files (conftest.py).
          VIRGIL_SKIP_DTYPE_INDEPENDENT: ${{ matrix.x64 }}
          VIRGIL_SLOW_FILES: ${{ matrix.orbit_slow }}
          # Seconds per test not marked slow (tests/conftest.py), only with a
          # warm cache for this job, JAX and packing. Fast tests peak near 25 s.
          VIRGIL_TEST_BUDGET: ${{ matrix.budget && startsWith(steps.cache.outputs.cache-matched-key, steps.key.outputs.prefix) && '30' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            nproc; free -m; df -h .
            .github/scripts/mem_sampler.sh &
          fi
          echo "per-test budget: ${VIRGIL_TEST_BUDGET:-off} s"
          .venv/bin/python -m pytest -n ${{ matrix.lowest && '2' || 'auto' }} --dist loadgroup -rs --durations=30 \
            --ignore=tests/lint \
            ${{ !matrix.slow && !matrix.orbit_slow && '-m "not slow"' || '' }} \
            ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }} \
            --junitxml=junit-evidence.xml -o junit_family=xunit1

      # TEMPORARY diagnosis of test_a_tiny_case_writes_valid_rows failing on
      # the lowest job only (21.25 mas on CI, 0.001 mas locally at the same
      # versions): the runner's CPU, then the test alone in a fresh process
      # without and with the JAX cache, and the snapshot, truth and found positions. Removed once the cause is known.
      - name: diagnose the lowest-job failure
        if: failure() && matrix.lowest
        env: {JAX_ENABLE_X64: "0"}
        run: |
          lscpu | grep -E "Model name|Flags" | cut -c1-400 || true
          t=tests/test_benchmark_harness.py::test_a_tiny_case_writes_valid_rows
          echo "--- alone, no cache"
          JAX_ENABLE_COMPILATION_CACHE=false .venv/bin/python -m pytest $t -o addopts= -p no:cacheprovider -q 2>&1 | grep -E "^E  |passed|failed" || true
          echo "--- positions: snapshots, truth, found"
          .venv/bin/python - <<'PY' 2>&1 | grep -E "^(truth|found|err|snap|peaks1|gn)" || true
          import sys
          sys.path.insert(0, "benchmarks/orbits")
          import jax, numpy as onp
          import cases, run_bench
          from virgil.epochs import epoch_positions
          system = cases.build(cases.Case(**run_bench.SIZES["tiny"]["ref"]))
          with jax.enable_x64(True):
              snaps = system.epochs.snapshots(cases.scene(**system.truth_values))
              print("snap  dra ", onp.round([float(s.dra) for s in snaps], 3))
              print("snap  ddec", onp.round([float(s.ddec) for s in snaps], 3))
          tdra, tddec = run_bench._truth_positions(system)
          import virgil.epochs as E
          orig = E._gauss_newton.solve
          def spy(*a, **k):
              st = orig(*a, **k)
              print("gn stop", int(st.stop), "steps", int(st.steps), "value", round(float(st.value), 4), "z", onp.round(onp.asarray(st.z), 4).tolist(), flush=True)
              return st
          E._gauss_newton.solve = spy
          res = epoch_positions(system.epochs, system.grid)
          print("truth dra ", onp.round(tdra, 3))
          print("truth ddec", onp.round(tddec, 3))
          print("found dra ", onp.round(onp.asarray(res.dra), 3))
          print("found ddec", onp.round(onp.asarray(res.ddec), 3))
          print("err       ", onp.round(onp.hypot(res.dra - tdra, res.ddec - tddec), 3))
          import dataclasses
          for f in dataclasses.fields(res.peaks[1]):
              print("peaks1", f.name, onp.asarray(getattr(res.peaks[1], f.name)).tolist())
          PY
          echo "--- alone, with the restored cache"
          JAX_COMPILATION_CACHE_DIR=.jax-cache JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0 JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES=0 .venv/bin/python -m pytest $t -o addopts= -p no:cacheprovider -q 2>&1 | grep -E "^E  |passed|failed" || true

      - name: kernel log
        if: always() && runner.os == 'Linux'
        run: sudo dmesg | grep -iE "oom|killed process" | tail -20 || true

      # For the nightly report, the x64 evidence and scripts/update_test_durations.py.
      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "junit-${{ matrix.id }}", path: junit-evidence.xml, retention-days: 14, if-no-files-found: ignore}

      - name: save JAX compilation cache
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: {path: .jax-cache, key: "${{ steps.key.outputs.prefix }}${{ steps.key.outputs.week }}"}

  x64-evidence:
    name: join the x64 evidence
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github/scripts}
      - uses: actions/download-artifact@v4
        with: {pattern: "junit-ubuntu-latest-py3.12-x641-shard*", path: shards}
      - run: python3 .github/scripts/join_junit.py shards junit-evidence.xml
      - uses: actions/upload-artifact@v4
        with: {name: virgil-evidence-ubuntu-latest-py3.12-x641, path: junit-evidence.xml}

  # Builds as publish.yml does and imports the wheel from a clean environment.
  package:
    name: build and install the wheel
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # uv.lock must match pyproject.toml; uv build builds the wheel from
      # the sdist, so it also checks the sdist.
      - run: |
          uv lock --check
          uv build
          uvx twine check --strict dist/*
          uv venv --python 3.12 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
      - name: import and smoke test
        working-directory: /tmp
        run: /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"

  # A nightly failure opens (or adds to) one issue naming the failing tests
  # and the commits since the last green nightly; a green nightly closes it.
  # The script also deletes JAX caches from earlier weeks.
  nightly-report:
    name: report the nightly run
    needs: [build, package]
    if: always() && (github.event_name == 'schedule' || inputs.nightly)
    runs-on: ubuntu-latest
    permissions: {actions: write, contents: read, issues: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "junit-*", path: junit}
      - name: open, update or close the issue, clean the caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result == 'success' && needs.package.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/nightly_report.py junit

  # A red push to main opens (or adds to) one issue labelled `red-main`
  # naming the failing tests; the next green push closes it. A failure in
  # any job counts; a cancelled run (a newer push) reports nothing.
  main-report:
    name: report the main run
    needs: [matrix, build, package, x64-evidence]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read, issues: write}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github/scripts}
      - uses: actions/download-artifact@v4
        with: {pattern: "junit-*", path: junit}
      - name: open, update or close the issue
        env:
          REPORT: main
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || needs.build.result == 'success' && needs.package.result == 'success' && 'success' || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = skipped ]; then echo "nothing to report"; exit 0; fi
          python3 .github/scripts/nightly_report.py junit
