# Date : 23/2/2024
# Title : tests.yml
# Description : Automatically runs tests when branches are merged.
#   The tests that are run can be found in the tests directory.

name: automated tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      # Linting lives in lint.yml and docs builds in documentation.yml, so
      # neither blocks the test suite.

      # Most of the suite's time is JAX compiling; JAX's persistent cache
      # (keyed internally on the JAX version and the code compiled) halves
      # it on later runs. Each run saves an updated cache.
      - name: JAX compilation cache
        uses: actions/cache@v4
        with:
          path: .jax-cache
          key: jax-${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: jax-${{ matrix.python-version }}-

      # ===== Tests =====
      - name: Test Suite
        env:
          JAX_COMPILATION_CACHE_DIR: .jax-cache
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
          JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
        run: uv run --python .venv/bin/python pytest
