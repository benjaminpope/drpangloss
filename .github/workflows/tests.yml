# Author : Benjamin Pope
# Date : 23/2/2024
# Title : tests.yml
# Description : Automatically runs tests when branches are merged.
#   The tests that are run can be found in the tests directory.

name: automated tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} py${{ matrix.python-version }}${{ matrix.x64 == '1' && ' x64' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        x64: ["0"]
        include:
          # The jax.enable_x64 dtype mix-up fixed in bessel.py surfaced locally
          # on macOS but not in Linux CI; x64 exercises the float64 paths.
          - os: macos-latest
            python-version: "3.12"
            x64: "0"
          - os: ubuntu-latest
            python-version: "3.12"
            x64: "1"
    env:
      JAX_ENABLE_X64: ${{ matrix.x64 }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          # Test against the newest JAX the other dependencies allow.
          uv pip install --python .venv/bin/python --upgrade jax jaxlib
          .venv/bin/python -c "import jax; print('jax', jax.__version__)"

      # Linting lives in lint.yml and docs builds in documentation.yml, so
      # neither blocks the test suite.

      # ===== Tests =====
      - name: Test Suite
        run: uv run --python .venv/bin/python pytest

