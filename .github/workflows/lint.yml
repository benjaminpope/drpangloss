name: lint

on:
  push:
    branches:
      - main
  pull_request:
  # Dispatched on the lock-upgrade branch by lock-upgrade.yml.
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with [tool.ruff] required-version and .pre-commit-config.yaml.
  RUFF_VERSION: 0.11.0

permissions:
  contents: read

# This job only checks. It used to push ruff's fixes back to the branch, but
# a push made with GITHUB_TOKEN triggers no workflows, so the fixed commit
# was never tested. Fix locally with `bash scripts/lint_local.sh --fix` (or
# the pre-commit hooks) and push again.
jobs:
  lint:
    name: Ruff check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # only for the size comment below
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      # One PR comment with the net Python lines changed in src/ and tests/
      # ("Keeping the code small" in AGENTS.md). Never fails the build: a fork's
      # read-only token or an API error just skips it. It runs in this job, not
      # `checks`, because that one executes the PR's code and this one does not
      # (the metrics table below runs the base's copy of its script).
      - name: size comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          api=repos/${GITHUB_REPOSITORY}/issues
          sum() { gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq \
            ".[] | select(.filename | test(\"^$1/.*[.]py$\")) | \"\(.additions) \(.deletions)\"" \
            | awk '{ a += $1; r += $2 } END { printf "| `'$1'/` | +%d | -%d | **%d** |", a, r, a - r }'; }
          src=$(sum src)
          body="<!-- size-comment -->
          **Size of this PR** (Python lines)

          | | added | removed | net |
          |---|---:|---:|---:|
          $src
          $(sum tests)"
          [ "$(echo "$src" | tr -d '*' | awk -F'|' '{ print $5 + 0 }')" -gt 1000 ] && body+="

          Net src growth is over +1,000 lines: say in the PR description what it buys and what it supersedes (rule 7 in AGENTS.md)."
          # Before/after metrics (single-use private defs, docstring bands).
          # The base's copy of the script runs (it only parses src/), so a PR
          # cannot run its own code with this job's token; until the base has
          # the script the table is skipped.
          tool="$RUNNER_TEMP/metrics"; mkdir -p "$tool/base"
          if git fetch -q --depth=1 origin "$BASE" \
            && git show "origin/$BASE:scripts/code_shape_metrics.py" > "$tool/metrics.py" \
            && git archive "origin/$BASE" src/virgil | tar -x -C "$tool/base" \
            && table=$(python3 "$tool/metrics.py" "$tool/base/src/virgil" src/virgil "$BASE" "this PR" 2>/dev/null); then
            body+="

          $table"
          fi
          id=$(gh api --paginate "$api/${PR}/comments" --jq '.[] | select(.body | startswith("<!-- size-comment -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "$api/comments/$id" -f body="$body"; else gh api -X POST "$api/${PR}/comments" -f body="$body"; fi >/dev/null

      - name: ruff check
        run: uvx ruff@${RUFF_VERSION} check --output-format=github --force-exclude .

      # --diff prints the changes ruff would make, so the log shows the fix.
      - name: ruff format --check
        run: uvx ruff@${RUFF_VERSION} format --diff --force-exclude src tests examples scripts

  # The single-use private helper gate (rule 8 in AGENTS.md): fails if the PR
  # adds a private def that is called once, unless exempt. Read-only token.
  # Which copy of scripts/code_shape.py decides: the BASE branch's, so a PR
  # cannot weaken the gate by editing the script. Until the base has the gate
  # (the PR that introduced it) the PR's own copy runs, which is what
  # exercises the rule on that PR. This job has no write token or secrets.
  helper-gate:
    name: single-use private helpers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE: ${{ github.base_ref }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: no new single-use private helpers
        run: |
          git fetch -q --depth=1 origin "$BASE"
          script=scripts/code_shape.py
          tool="$RUNNER_TEMP/shape"; mkdir -p "$tool/scripts"
          if git show "origin/$BASE:$script" | grep -q find_single_use; then
            git show "origin/$BASE:$script" > "$tool/$script"
            for d in src tests .git; do ln -sfn "$PWD/$d" "$tool/$d"; done
            script="$tool/$script"
          fi
          python3 "$script" --since "origin/$BASE"

  # Changelog fragments (changelog.d/README.md): only a release PR (head
  # branch `release*`) may edit CHANGELOG.md, so parallel PRs never conflict
  # there. A src/ change with no new fragment only warns.
  changelog:
    name: changelog fragments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.head_ref }}
    steps:
      - name: CHANGELOG.md untouched; fragment present
        run: |
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[] | "\(.status) \(.filename)"')
          if echo "$files" | grep -q ' CHANGELOG.md$' && [[ "$HEAD" != release* ]]; then
            echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md; add a fragment to changelog.d/ (see its README)."
            exit 1
          fi
          if echo "$files" | grep -q ' src/' && ! echo "$files" | grep -Eq '^(added|renamed) changelog\.d/[^/]+\.md$'; then
            echo "::warning::src/ changed but no changelog.d/ fragment was added (see changelog.d/README.md)."
          fi

  # Checks that need virgil importable but no JAX compiles: generated docs in
  # sync with the notebooks, notebook outputs not stale, the package layout.
  # tests.yml skips tests/lint, so one stale markdown file fails one job, not
  # every test job.
  checks:
    name: docs sync, notebook outputs, package layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: uv sync --locked --python 3.12 --extra test

      - name: tests/lint
        run: .venv/bin/python -m pytest tests/lint -rs
