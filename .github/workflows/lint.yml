name: lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with [tool.ruff] required-version and .pre-commit-config.yaml.
  RUFF_VERSION: 0.11.0

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix (same-repo PRs)
    runs-on: ubuntu-latest
    # Fork PRs get no write token, so they fall through to the read-only lint job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: ruff autofix
        run: |
          uvx ruff@${RUFF_VERSION} check --fix-only --force-exclude .
          uvx ruff@${RUFF_VERSION} format --force-exclude src tests examples scripts

      - name: commit and push
        run: |
          if git diff --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply ruff autofixes"
          git push origin HEAD:${{ github.head_ref }}

  lint:
    name: Ruff check
    runs-on: ubuntu-latest
    needs: autofix
    # Runs even when autofix is skipped (fork PRs, pushes to main) or fails.
    if: always()
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: ruff check
        run: uvx ruff@${RUFF_VERSION} check --output-format=github --force-exclude .

      - name: ruff format --check
        run: uvx ruff@${RUFF_VERSION} format --check --force-exclude src tests examples scripts
