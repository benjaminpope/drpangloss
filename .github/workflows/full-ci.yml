name: full CI on label

# Adding the full-ci label to a pull request runs the full test matrix
# (macOS, py3.13 and the slow tests; see tests.yml) on its branch now.
# tests.yml also reads the label on every later push. A dispatch, because a
# `labeled` trigger in tests.yml would restart its runs for every label.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: write

jobs:
  dispatch:
    name: dispatch the full matrix
    if: github.event.label.name == 'full-ci' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run tests.yml -R "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
