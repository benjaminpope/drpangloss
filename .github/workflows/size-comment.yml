name: size comment

# Posts (and then updates) one comment on each pull request with its net
# change in Python lines under src/ and tests/, to make growth visible (see
# "Keeping the code small" in AGENTS.md). It never gates a pull request:
# every step tolerates failure, so a missing permission (a pull request from
# a fork gets a read-only token) or an API error leaves the check green.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: size-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# contents: read is what checkout needs; pull-requests: write is what
# commenting on a pull request needs. Nothing else is granted.
permissions:
  contents: read
  pull-requests: write

env:
  # Net src growth above this adds the reminder to the comment.
  SRC_GROWTH_LIMIT: 1000

jobs:
  size:
    name: net lines changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e  # nothing here may fail the build

          # Added and removed Python lines in a directory, from numstat
          # (binary files show "-" and count as zero).
          count() {
            git diff --numstat "origin/${BASE_REF}...HEAD" -- "$1" \
              | awk '$3 ~ /\.py$/ { a += $1; r += $2 } END { printf "%d %d", a, r }'
          }
          read -r src_add src_del <<< "$(count src)"
          read -r tests_add tests_del <<< "$(count tests)"
          src_net=$((src_add - src_del))
          tests_net=$((tests_add - tests_del))

          body="<!-- size-comment -->"$'\n'
          body+="**Size of this PR** (Python lines, \`git diff --numstat origin/${BASE_REF}...HEAD\`)"$'\n\n'
          body+="| | added | removed | net |"$'\n'
          body+="|---|---:|---:|---:|"$'\n'
          body+="| \`src/\` | +${src_add} | -${src_del} | **${src_net}** |"$'\n'
          body+="| \`tests/\` | +${tests_add} | -${tests_del} | **${tests_net}** |"$'\n'
          if [ "$src_net" -gt "$SRC_GROWTH_LIMIT" ]; then
            body+=$'\n'"Net \`src/\` growth is over +${SRC_GROWTH_LIMIT} lines. Per rule 7 of [Keeping the code small](https://github.com/${REPO}/blob/${BASE_REF}/AGENTS.md#keeping-the-code-small), say in the PR description what this size buys and what it supersedes (rule 1: delete before you add). This comment does not block merging."$'\n'
          fi
          echo "$body"

          # Update our earlier comment if there is one, else create it.
          id=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
                 --jq '.[] | select(.body | startswith("<!-- size-comment -->")) | .id' \
               | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi || echo "::warning::could not post the size comment"
          exit 0
