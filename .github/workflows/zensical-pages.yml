name: Documentation (Zensical)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-zensical:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          architecture: x64

      - name: create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . zensical mkdocstrings mkdocstrings[python] mkdocs-material mkdocs-jupyter

      - name: build documentation (zensical)
        run: uv run --python .venv/bin/python zensical build --clean

  deploy-zensical-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ZENSICAL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build-zensical
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: configure pages
        uses: actions/configure-pages@v5

      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          architecture: x64

      - name: create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . zensical mkdocstrings mkdocstrings[python] mkdocs-material mkdocs-jupyter

      - name: build documentation (zensical)
        run: uv run --python .venv/bin/python zensical build --clean

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
