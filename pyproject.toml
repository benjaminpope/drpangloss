[project]
name = "virgil-astro"
version = "0.2.0"
description = "VIRGIL, the Versatile Interferometric Reconstruction and Gradient-based Inference Library: modelling and imaging interferometric data in JAX."
readme = "README.md"
requires-python =">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au"},
  {name = "Dori Blakely", email = "blakelyd@uvic.ca"},
  {name = "Shashank Dholakia", email = "shashankdholakia1@gmail.com"},
  {name = "Max Charles"},
  {name = "Toon De Prins", email = "toon.deprins@protonmail.com"},
  {name = "Louis Desdoigts", email = "ldes9555@uni.sydney.edu.au"},
]
keywords = ["python", "optics", "machine-learning", "jax", "autodiff", "differentiable", "diffraction", "simulation", "telescope", "virgil"]
urls = {repository = "https://github.com/benjaminpope/virgil"}
dependencies = [
  "jax>=0.4.30",
  "jaxbessel>=0.1.0",
  "equinox>=0.11",
  "zodiax>=0.4",
  "optimistix>=0.0.10",
  "lineax>=0.0.5",
  "optax>=0.2.4",
  "numpyro>=0.15",
  "numpy",
  # scipy.spatial.ConvexHull triangulates the stellar mesh in _elr.py
  # (jax already depends on scipy).
  "scipy",
  "matplotlib",
  "pandas",
  "chainconsumer",
  "astropy",
  "pyoifits",
  # Only needed by the legacy writer in oifits_implaneia.py.
  "astroquery",
  "termcolor",
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
notebooks = [
  "tqdm",
  "ipywidgets",
]
sampling = [
  "blackjax",
]
dev = [
  "ruff==0.11.0",
  "pre-commit",
  "pytest",
  "pytest-xdist",
  "scipy",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "zensical",
]

[tool.ruff]
line-length = 79
# Must match the rev in .pre-commit-config.yaml and RUFF_VERSION in the workflows.
required-version = "==0.11.0"
force-exclude = true
extend-exclude = [
  "site",
  "docs/generated",
  "notebooks/archive",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.per-file-ignores]
"src/virgil/__init__.py" = ["F401"]
"notebooks/contrast_limits.ipynb" = ["E702"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
  "ignore:Setting `jax_pmap_shmap_merge` is deprecated in JAX v0.9.0:DeprecationWarning",
]