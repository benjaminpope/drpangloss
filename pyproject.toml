[project]
name = "drpangloss"
version = "0.1.1"
description = "Python package to fit interferometric data, accelerated using Jax."
readme = "README.md"
requires-python =">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au"},
  {name = "Dori Blakely", email = "blakelyd@uvic.ca"}
]
keywords = ["python", "optics", "machine-learning", "jax", "autodiff", "differentiable", "diffraction", "simulation", "telescope", "drpangloss"]
urls = {repository = "https://github.com/benjaminpope/drpangloss"}
dependencies = [
  "jax>=0.4.30",
  "jaxbessel>=0.1.0",
  "equinox>=0.11",
  "zodiax>=0.4",
  "optimistix>=0.0.10",
  "lineax>=0.0.5",
  "optax>=0.2.3",
  "numpyro>=0.15",
  "numpy",
  "matplotlib",
  "pandas",
  "chainconsumer",
  "astropy",
  "pyoifits",
  # Only needed by the legacy writers in savefits.py / oifits_implaneia.py.
  "astroquery",
  "termcolor",
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
notebooks = [
  "tqdm",
  "ipywidgets",
]
dev = [
  "ruff==0.11.0",
  "pre-commit",
  "pytest",
  "scipy",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "zensical",
]

[tool.ruff]
line-length = 79
# Must match the rev in .pre-commit-config.yaml and RUFF_VERSION in the workflows.
required-version = "==0.11.0"
force-exclude = true
extend-exclude = [
  "site",
  "docs/generated",
  "notebooks/archive",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.per-file-ignores]
"src/drpangloss/__init__.py" = ["F401"]
"notebooks/contrast_limits.ipynb" = ["E702"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
  "ignore:Setting `jax_pmap_shmap_merge` is deprecated in JAX v0.9.0:DeprecationWarning",
]